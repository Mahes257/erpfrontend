# ============================================
# Application
# ============================================
spring.application.name=erp-backend
server.port=8080
server.servlet.context-path=/v1

# Base URL used to build absolute download links for attachments
app.base-url=http://localhost:8080

# ============================================
# MySQL
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/erp_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=admin123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# JWT
# ============================================
app.jwt.secret=Nz96qAZLOy290Ew9YYVoJUeqBnWIE275mCCq3aUi5JlgA9tjMp5CvO2Yme35ICud
app.jwt.expiration-ms=86400000

# ============================================
# File uploads
# ============================================
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============================================
# JSON
# ============================================
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.fail-on-empty-beans=false

# ============================================
# Exchange rates (centralized service)
# ============================================
# Public keyless provider: open.er-api.com (ExchangeRate-API free endpoint).
exchange.api.url=https://open.er-api.com/v6/latest/{base}
exchange.refresh.hours=24
exchange.base.default=INR

# ============================================
# Logging
# ============================================
logging.level.com.vishatech.erp=INFO
